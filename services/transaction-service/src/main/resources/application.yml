server:
  port: 8082

spring:
  application:
    name: transaction-service
  jackson:
    default-property-inclusion: non_null
  threads:
    virtual:
      enabled: true
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:transaction_db}
    username: ${DB_USER:bank_ledger}
    password: ${DB_PASSWORD:bank_ledger_secret}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 30
      minimum-idle: 10
      connection-timeout: 30000
      leak-detection-threshold: 10000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: public
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
      compression-type: snappy
      batch-size: 65536
      buffer-memory: 67108864
      properties:
        linger.ms: 5
    consumer:
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      enable-auto-commit: false
      auto-offset-reset: earliest
    listener:
      ack-mode: manual_immediate

app:
  security:
    jwks-url: ${JWKS_URL:http://localhost:8086/.well-known/jwks.json}

bankledger:
  outbox:
    poller:
      enabled: ${OUTBOX_POLLER_ENABLED:true}
      auto-startup: ${OUTBOX_POLLER_AUTO_STARTUP:true}
      batch-size: ${OUTBOX_POLLER_BATCH_SIZE:50}
      interval-ms: ${OUTBOX_POLLER_INTERVAL_MS:200}
      max-attempts: ${OUTBOX_POLLER_MAX_ATTEMPTS:5}
      publish-timeout-ms: ${OUTBOX_POLLER_PUBLISH_TIMEOUT_MS:5000}

management:
  opentelemetry:
    resource-attributes:
      service.name: ${spring.application.name}
    tracing:
      export:
        otlp:
          endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318}/v1/traces
    logging:
      export:
        otlp:
          endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318}/v1/logs
  tracing:
    sampling:
      probability: 1.0
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always


springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs
