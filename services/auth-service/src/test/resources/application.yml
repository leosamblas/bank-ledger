spring:
  application:
    name: auth-service-test
  datasource:
    url: jdbc:h2:mem:auth_db;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  flyway:
    enabled: false
  data:
    redis:
      host: localhost
      port: 6379
  kafka:
    listener:
      auto-startup: false
    producer:
      properties:
        max.block.ms: 200

app:
  security:
    internal-service-key: bankledger-internal-secret-ledger-key-2026
    dummy-hash: "$2a$10$7EqJtq98hPqEX7fNZaFWoO0Z4qD5gR4m8YQ0CqD8.7Uu7W9n7I.wK"
    access-token-validity-seconds: 900
    refresh-token-validity-seconds: 604800

bankledger:
  security:
    jwt:
      issuer: https://auth.bank.internal
      audience: bankledger
      expiration-seconds: 3600
