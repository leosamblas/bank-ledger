spring:
  application:
    name: auth-service-test
  datasource:
    url: jdbc:h2:mem:auth_db;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  flyway:
    enabled: false

app:
  security:
    dummy-argon2-hash: "$argon2id$v=19$m=19456,t=3,p=1$A95dCHZGbTCnwE0PsaX0Vw$PpVtTpb8S+tIiPPH7dFQLQqb1quYB17eMUJZI+Mbcz8"
    access-token-validity-seconds: 900
    refresh-token-validity-seconds: 604800

bankledger:
  security:
    jwt:
      issuer: https://auth.bank.internal
      audience: bankledger
      expiration-seconds: 3600
