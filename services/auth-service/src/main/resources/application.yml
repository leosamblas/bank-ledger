server:
  port: 8086

spring:
  application:
    name: auth-service
  jackson:
    default-property-inclusion: non_null
  threads:
    virtual:
      enabled: true
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:auth_db}
    username: ${DB_USER:bank_ledger}
    password: ${DB_PASSWORD:bank_ledger_secret}
    driver-class-name: org.postgresql.Driver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: public
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

app:
  security:
    dummy-argon2-hash: ${APP_SECURITY_DUMMY_ARGON2_HASH:$argon2id$v=19$m=19456,t=3,p=1$A95dCHZGbTCnwE0PsaX0Vw$PpVtTpb8S+tIiPPH7dFQLQqb1quYB17eMUJZI+Mbcz8}
    access-token-validity-seconds: ${ACCESS_TOKEN_VALIDITY_SECONDS:900}
    refresh-token-validity-seconds: ${REFRESH_TOKEN_VALIDITY_SECONDS:604800}

bankledger:
  security:
    jwt:
      issuer: ${JWT_ISSUER:https://auth.bank.internal}
      audience: ${JWT_AUDIENCE:bankledger}
      expiration-seconds: ${JWT_EXPIRATION_SECONDS:3600}

management:
  opentelemetry:
    resource-attributes:
      service.name: ${spring.application.name}
    tracing:
      export:
        otlp:
          endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318}/v1/traces
    logging:
      export:
        otlp:
          endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318}/v1/logs
  tracing:
    sampling:
      probability: 1.0
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

logging:
  pattern:
    level: "%5p [${spring.application.name:},%X{traceId:-},%X{spanId:-}]"

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs
