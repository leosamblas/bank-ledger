plugins {
    id 'base'
}

allprojects {
    group = 'com.bankledger'
    version = '0.1.0-SNAPSHOT'
}

subprojects {
    ext {
        testcontainersVersion = project.findProperty('testcontainersVersion') ?: '1.20.4'
    }
    ext['testcontainers.version'] = testcontainersVersion

    plugins.withId('io.spring.dependency-management') {
        dependencyManagement {
            imports {
                mavenBom "org.testcontainers:testcontainers-bom:${testcontainersVersion}"
            }
        }
    }

    tasks.withType(Test).configureEach {
        systemProperty 'reactor.schedulers.defaultBoundedElasticOnVirtualThreads', 'true'
    }
    tasks.withType(JavaExec).configureEach {
        systemProperty 'reactor.schedulers.defaultBoundedElasticOnVirtualThreads', 'true'
    }
}
