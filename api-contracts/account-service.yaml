openapi: 3.0.3
info:
  title: Account Service API
  version: 1.0.0
servers:
  - url: http://localhost:8081/api/v1
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    ProblemDetail:
      type: object
      properties:
        type:
          type: string
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        instance:
          type: string
    AccountCreationRequest:
      type: object
      required: [fullName, cpf, birthDate, email, phone, password]
      properties:
        fullName:
          type: string
        cpf:
          type: string
        birthDate:
          type: string
          format: date
        email:
          type: string
          format: email
        phone:
          type: string
        password:
          type: string
          format: password
    LoginRequest:
      type: object
      required: [cpf, password]
      properties:
        cpf:
          type: string
        password:
          type: string
          format: password
    TokenResponse:
      type: object
      properties:
        token:
          type: string
        expiresIn:
          type: integer
    AccountResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        customerId:
          type: string
          format: uuid
        agency:
          type: string
        number:
          type: string
        digit:
          type: string
        status:
          type: string
        openedAt:
          type: string
          format: date-time
    AccountLookupResponse:
      type: object
      properties:
        accountId:
          type: string
          format: uuid
        agency:
          type: string
        number:
          type: string
        holderNameMasked:
          type: string
    UpdateStatusRequest:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [ACTIVE, BLOCKED, CLOSED]
        reason:
          type: string

paths:
  /accounts:
    post:
      summary: Abre uma nova conta
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AccountCreationRequest'
      responses:
        '201':
          description: Conta criada com sucesso (PENDING_ACTIVATION)
          headers:
            Location:
              schema:
                type: string
        '400':
          description: Bad Request
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '409':
          description: Conflict (e.g. CPF already exists)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '422':
          description: Unprocessable Entity (e.g. Invalid CPF or Underage)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
  /auth/login:
    post:
      summary: Autentica o usuário e retorna o JWT
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Sucesso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '401':
          description: Unauthorized
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
  /accounts/me:
    get:
      summary: Retorna a conta do usuário logado
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Sucesso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountResponse'
  /accounts/{accountId}:
    get:
      summary: Retorna os detalhes de uma conta específica
      security:
        - bearerAuth: []
      parameters:
        - name: accountId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Sucesso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountResponse'
        '403':
          description: Forbidden (Not the owner)
        '404':
          description: Not Found
  /accounts/lookup:
    get:
      summary: Busca conta por agência e número para exibir nome mascarado
      security:
        - bearerAuth: []
      parameters:
        - name: agency
          in: query
          required: true
          schema:
            type: string
        - name: number
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Sucesso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountLookupResponse'
        '404':
          description: Not Found
  /accounts/{accountId}/status:
    patch:
      summary: Atualiza o status da conta (Requer perfil ADMIN)
      security:
        - bearerAuth: []
      parameters:
        - name: accountId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateStatusRequest'
      responses:
        '200':
          description: Status atualizado com sucesso
