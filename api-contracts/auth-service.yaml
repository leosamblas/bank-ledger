openapi: 3.0.3
info:
  title: Reactive Auth Service API
  version: 1.0.0
  description: Microservice for reactive authentication, BCrypt hashing, and decentralized JWKS validation.
servers:
  - url: http://localhost:8086
  - url: http://localhost:8080/api/v1
paths:
  /api/v1/auth/login:
    post:
      summary: Authenticates user credentials and returns active/new JWT and refresh token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Successfully authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '401':
          description: Invalid credentials or account locked
  /api/v1/auth/refresh:
    post:
      summary: Exchanges a valid refresh token for a fresh access token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshTokenRequest'
      responses:
        '200':
          description: Token refreshed successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '401':
          description: Invalid or expired refresh token
  /.well-known/jwks.json:
    get:
      summary: Returns the RFC 7517 JSON Web Key Set (JWKS) with public verification keys
      responses:
        '200':
          description: JWKS public keys
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JwksResponse'
  /api/v1/auth/introspect:
    post:
      summary: RFC 7662 Token Introspection
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IntrospectRequest'
      responses:
        '200':
          description: Token status and metadata
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IntrospectResponse'

components:
  schemas:
    LoginRequest:
      type: object
      required: [cpf, password]
      properties:
        cpf:
          type: string
          example: "52998224725"
        password:
          type: string
          format: password
    RefreshTokenRequest:
      type: object
      required: [refreshToken]
      properties:
        refreshToken:
          type: string
    TokenResponse:
      type: object
      properties:
        token:
          type: string
        expiresIn:
          type: integer
          description: Dynamic remaining seconds until expiration
        tokenType:
          type: string
          example: Bearer
        refreshToken:
          type: string
        user:
          $ref: '#/components/schemas/UserInfo'
    UserInfo:
      type: object
      properties:
        id:
          type: string
          format: uuid
        fullName:
          type: string
        cpf:
          type: string
        email:
          type: string
    IntrospectRequest:
      type: object
      required: [token]
      properties:
        token:
          type: string
    IntrospectResponse:
      type: object
      properties:
        active:
          type: boolean
        sub:
          type: string
        customerId:
          type: string
        accountId:
          type: string
        role:
          type: string
    JwksResponse:
      type: object
      properties:
        keys:
          type: array
          items:
            type: object
