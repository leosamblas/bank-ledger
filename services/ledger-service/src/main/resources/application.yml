server:
  port: 8084

spring:
  application:
    name: ledger-service
  jackson:
    default-property-inclusion: non_null
  threads:
    virtual:
      enabled: true
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:ledger_db}
    username: ${DB_USER:bank_ledger}
    password: ${DB_PASSWORD:bank_ledger_secret}
    driver-class-name: org.postgresql.Driver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: public
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
    consumer:
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      enable-auto-commit: false
    listener:
      ack-mode: manual_immediate

bankledger:
  outbox:
    poller:
      enabled: ${OUTBOX_POLLER_ENABLED:true}
      auto-startup: ${OUTBOX_POLLER_AUTO_STARTUP:true}
      batch-size: ${OUTBOX_POLLER_BATCH_SIZE:50}
      interval-ms: ${OUTBOX_POLLER_INTERVAL_MS:200}
      max-attempts: ${OUTBOX_POLLER_MAX_ATTEMPTS:5}
      publish-timeout-ms: ${OUTBOX_POLLER_PUBLISH_TIMEOUT_MS:2000}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs
