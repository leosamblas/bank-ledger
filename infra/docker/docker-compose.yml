services:
  postgres:
    image: postgres:18-alpine
    container_name: bank-ledger-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: bank_ledger
      POSTGRES_PASSWORD: bank_ledger_secret
      POSTGRES_DB: postgres
      PGDATA: /var/lib/postgresql/data
    command: >
      postgres
      -c max_connections=300
      -c shared_buffers=256MB
      -c effective_cache_size=768MB
      -c maintenance_work_mem=64MB
      -c checkpoint_completion_target=0.9
      -c wal_buffers=16MB
      -c default_statistics_target=100
      -c random_page_cost=1.1
      -c effective_io_concurrency=200
      -c work_mem=16MB
      -c min_wal_size=1GB
      -c max_wal_size=4GB
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres/init-databases.sql:/docker-entrypoint-initdb.d/init-databases.sql:ro
    deploy:
      resources:
        limits:
          memory: 1024M
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bank_ledger -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - bank-ledger-network

  redis:
    image: redis:7-alpine
    container_name: bank-ledger-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    deploy:
      resources:
        limits:
          memory: 256M
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - bank-ledger-network

  kafka:
    image: confluentinc/cp-kafka:8.4.0
    container_name: bank-ledger-kafka
    restart: unless-stopped
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: 'broker,controller'
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: 'PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT,CONTROLLER:PLAINTEXT'
      KAFKA_LISTENERS: 'PLAINTEXT://0.0.0.0:29092,PLAINTEXT_HOST://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093'
      KAFKA_ADVERTISED_LISTENERS: 'PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092'
      KAFKA_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'
      KAFKA_CONTROLLER_QUORUM_VOTERS: '1@kafka:9093'
      KAFKA_INTER_BROKER_LISTENER_NAME: 'PLAINTEXT'
      CLUSTER_ID: 'MkU3OEVBNTcwNTJENDM2Qk'
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_DEFAULT_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_LOG_DIRS: '/var/lib/kafka/data'
      KAFKA_HEAP_OPTS: "-Xmx1024m -Xms1024m"
    volumes:
      - kafka-data:/var/lib/kafka/data
    deploy:
      resources:
        limits:
          memory: 2048M
    healthcheck:
      test: ["CMD-SHELL", "kafka-broker-api-versions --bootstrap-server localhost:9092"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 15s
    networks:
      - bank-ledger-network

  kafka-init:
    image: confluentinc/cp-kafka:8.4.0
    container_name: bank-ledger-kafka-init
    restart: "no"
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: [ "/bin/bash", "-c" ]
    command: |
      "
      echo 'Creating Kafka topics...'
      kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists --topic account.events.v1 --partitions 3 --replication-factor 1
      kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists --topic ledger.commands.v1 --partitions 3 --replication-factor 1
      kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists --topic ledger.journal-results.v1 --partitions 3 --replication-factor 1
      kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists --topic ledger.account-events.v1 --partitions 3 --replication-factor 1
      kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists --topic ledger.entries.v1 --partitions 3 --replication-factor 1
      kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists --topic transaction.events.v1 --partitions 3 --replication-factor 1
      kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists --topic auth.credentials-registration.v1 --partitions 3 --replication-factor 1
      kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists --topic account.ready.v1 --partitions 3 --replication-factor 1
      echo 'All topics created/verified successfully with 3 partitions.'
      "
    networks:
      - bank-ledger-network

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: bank-ledger-kafka-ui
    restart: unless-stopped
    ports:
      - "8085:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: bank-ledger
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
      DYNAMIC_CONFIG_ENABLED: "true"
    deploy:
      resources:
        limits:
          memory: 512M
    depends_on:
      kafka:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8080/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - bank-ledger-network

  otel-lgtm:
    image: grafana/otel-lgtm:latest
    container_name: bank-ledger-otel-lgtm
    restart: unless-stopped
    ports:
      - "3001:3000" # Grafana UI on port 3001 (keeping web on 3000)
      - "4317:4317" # OTLP gRPC receiver
      - "4318:4318" # OTLP HTTP receiver
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
    deploy:
      resources:
        limits:
          memory: 2048M
    networks:
      - bank-ledger-network

  auth-service:
    build:
      context: ../../
      dockerfile: services/auth-service/Dockerfile
    container_name: bank-ledger-auth-service
    restart: unless-stopped
    ports:
      - "8086:8086"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/auth_db
      SPRING_DATASOURCE_USERNAME: bank_ledger
      SPRING_DATASOURCE_PASSWORD: bank_ledger_secret
      SERVER_PORT: 8086
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-lgtm:4318
      REDIS_HOST: redis
      REDIS_PORT: 6379
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      JAVA_TOOL_OPTIONS: "-Dreactor.schedulers.defaultBoundedElasticOnVirtualThreads=true"
    deploy:
      resources:
        limits:
          memory: 1024M
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:8086/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - bank-ledger-network

  account-service:
    build:
      context: ../../
      dockerfile: services/account-service/Dockerfile
    container_name: bank-ledger-account-service
    restart: unless-stopped
    ports:
      - "8081:8081"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/account_db
      SPRING_DATASOURCE_USERNAME: bank_ledger
      SPRING_DATASOURCE_PASSWORD: bank_ledger_secret
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      JAVA_TOOL_OPTIONS: "-Dreactor.schedulers.defaultBoundedElasticOnVirtualThreads=true"
      SERVER_PORT: 8081
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-lgtm:4318
      APP_SECURITY_JWKS_URL: http://auth-service:8086/.well-known/jwks.json
      APP_AUTH_SERVICE_URL: http://auth-service:8086
    deploy:
      resources:
        limits:
          memory: 1024M
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      auth-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:8081/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - bank-ledger-network

  ledger-service:
    build:
      context: ../../
      dockerfile: services/ledger-service/Dockerfile
    container_name: bank-ledger-ledger-service
    restart: unless-stopped
    expose:
      - "8084"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/ledger_db
      SPRING_DATASOURCE_USERNAME: bank_ledger
      SPRING_DATASOURCE_PASSWORD: bank_ledger_secret
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      JAVA_TOOL_OPTIONS: "-Dreactor.schedulers.defaultBoundedElasticOnVirtualThreads=true"
      SERVER_PORT: 8084
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-lgtm:4318
      APP_SECURITY_INTERNAL_SERVICE_KEY: bankledger-internal-secret-ledger-key-2026
    deploy:
      resources:
        limits:
          memory: 1024M
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:8084/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - bank-ledger-network

  transaction-service:
    build:
      context: ../../
      dockerfile: services/transaction-service/Dockerfile
    container_name: bank-ledger-transaction-service
    restart: unless-stopped
    ports:
      - "8082:8082"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/transaction_db
      SPRING_DATASOURCE_USERNAME: bank_ledger
      SPRING_DATASOURCE_PASSWORD: bank_ledger_secret
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      JAVA_TOOL_OPTIONS: "-Dreactor.schedulers.defaultBoundedElasticOnVirtualThreads=true"
      SERVER_PORT: 8082
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-lgtm:4318
      APP_SECURITY_JWKS_URL: http://auth-service:8086/.well-known/jwks.json
    deploy:
      resources:
        limits:
          memory: 1024M
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      ledger-service:
        condition: service_healthy
      auth-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:8082/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - bank-ledger-network

  query-service:
    build:
      context: ../../
      dockerfile: services/query-service/Dockerfile
    container_name: bank-ledger-query-service
    restart: unless-stopped
    ports:
      - "8083:8083"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/query_db
      SPRING_DATASOURCE_USERNAME: bank_ledger
      SPRING_DATASOURCE_PASSWORD: bank_ledger_secret
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      JAVA_TOOL_OPTIONS: "-Dreactor.schedulers.defaultBoundedElasticOnVirtualThreads=true"
      SERVER_PORT: 8083
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-lgtm:4318
      APP_SECURITY_JWKS_URL: http://auth-service:8086/.well-known/jwks.json
    deploy:
      resources:
        limits:
          memory: 1024M
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      auth-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:8083/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - bank-ledger-network

  notification-service:
    build:
      context: ../../
      dockerfile: services/notification-service/Dockerfile
    container_name: bank-ledger-notification-service
    restart: unless-stopped
    ports:
      - "8087:8087"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SERVER_PORT: 8087
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      JAVA_TOOL_OPTIONS: "-Dreactor.schedulers.defaultBoundedElasticOnVirtualThreads=true"
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-lgtm:4318
      MANAGEMENT_OTLP_METRICS_EXPORT_URL: http://otel-lgtm:4318/v1/metrics
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      MAIL_ENABLED: ${MAIL_ENABLED:-false}
    deploy:
      resources:
        limits:
          memory: 512M
    depends_on:
      kafka:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:8087/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - bank-ledger-network

  gateway:
    image: nginx:alpine
    container_name: bank-ledger-gateway
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    deploy:
      resources:
        limits:
          memory: 256M
    depends_on:
      auth-service:
        condition: service_healthy
      account-service:
        condition: service_healthy
      transaction-service:
        condition: service_healthy
      query-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:8080/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 3
      start_period: 3s
    networks:
      - bank-ledger-network

  web:
    build:
      context: ../../web
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8080/api/v1
        NEXT_PUBLIC_USE_MOCK: "false"
    container_name: bank-ledger-web
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
    deploy:
      resources:
        limits:
          memory: 512M
    depends_on:
      gateway:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:3000 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      - bank-ledger-network

volumes:
  postgres-data:
    name: bank-ledger-postgres-data
  kafka-data:
    name: bank-ledger-kafka-data

networks:
  bank-ledger-network:
    name: bank-ledger-network
    driver: bridge
