plugins {
    id 'java-library'
    id 'maven-publish'
}

group = 'com.bankledger'
version = '0.0.1-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}

repositories {
    mavenCentral()
}

dependencies {
    // Jackson 3
    api platform('tools.jackson:jackson-bom:3.0.0')
    api 'tools.jackson.core:jackson-databind'
    api 'com.fasterxml.jackson.core:jackson-annotations:2.18.2'

    // Jakarta Persistence API
    api 'jakarta.persistence:jakarta.persistence-api:3.2.0'

    // Spring Boot 4.1.2 dependencies (Data JPA, etc.)
    api 'org.springframework.boot:spring-boot-starter-data-jpa:4.1.2'

    // PostgreSQL driver
    runtimeOnly 'org.postgresql:postgresql:42.7.5'

    // Lombok (Java 25 support)
    compileOnly 'org.projectlombok:lombok:1.18.40'
    annotationProcessor 'org.projectlombok:lombok:1.18.40'
    testCompileOnly 'org.projectlombok:lombok:1.18.40'
    testAnnotationProcessor 'org.projectlombok:lombok:1.18.40'

    // Testing
    testImplementation platform('org.junit:junit-bom:5.11.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testImplementation 'org.assertj:assertj-core:3.27.3'
    testImplementation 'org.springframework.boot:spring-boot-starter-test:4.1.2'
    testImplementation 'org.testcontainers:junit-jupiter:1.20.4'
    testImplementation 'org.testcontainers:postgresql:1.20.4'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testRuntimeOnly 'org.postgresql:postgresql:42.7.5'
}

tasks.named('test') {
    useJUnitPlatform()
    systemProperty 'api.version', '1.44'
}
