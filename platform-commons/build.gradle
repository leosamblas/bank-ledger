plugins {
    id 'java-library'
    id 'org.springframework.boot' version '4.1.2'
    id 'io.spring.dependency-management' version '1.1.7'
    id 'maven-publish'
}

group = 'com.bankledger'
version = '0.1.0-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}

// Configuração para módulo de biblioteca: desabilita bootJar executável e gera jar convencional
bootJar {
    enabled = false
}

jar {
    enabled = true
}

tasks.named('resolveMainClassName') {
    enabled = false
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.compilerArgs << "-Xlint:all" << "-Xlint:-processing"
}

repositories {
    mavenCentral()
}

dependencyManagement {
    imports {
        mavenBom org.springframework.boot.gradle.plugin.SpringBootPlugin.BOM_COORDINATES
        mavenBom 'org.testcontainers:testcontainers-bom:1.20.4'
    }
}

dependencies {
    // Jackson 3 (gerenciado pelo Spring Boot BOM)
    api 'tools.jackson.core:jackson-databind'

    // Jakarta Persistence API (gerenciado pelo Spring Boot BOM)
    api 'jakarta.persistence:jakarta.persistence-api'

    // Spring Boot Starter Data JPA (gerenciado pelo Spring Boot BOM)
    api 'org.springframework.boot:spring-boot-starter-data-jpa'

    // PostgreSQL driver (gerenciado pelo Spring Boot BOM)
    runtimeOnly 'org.postgresql:postgresql'

    // Lombok (gerenciado pelo Spring Boot BOM)
    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'
    testCompileOnly 'org.projectlombok:lombok'
    testAnnotationProcessor 'org.projectlombok:lombok'

    // Testing (gerenciados pelos BOMs)
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testImplementation 'org.assertj:assertj-core'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.testcontainers:junit-jupiter'
    testImplementation 'org.testcontainers:postgresql'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testRuntimeOnly 'org.postgresql:postgresql'
}

tasks.named('test') {
    useJUnitPlatform()
    systemProperty 'api.version', '1.44'
    jvmArgs '-Xshare:off'
}
